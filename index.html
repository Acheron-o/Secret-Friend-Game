<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Secreto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./assets/favicon/favicon-32x32.png" type="image/x-icon">
</head>
<body>

    <main class="card">
        <header class="card-header">
            <div class="controls">
                <button id="lang-btn" class="icon-btn" aria-label="Mudar Idioma">
                    <img src="./assets/icons/idioma.png" alt="Mudar idioma">
                </button>
            </div>
            
            <h1>Amigo Secreto</h1>
            <div class="image-container">
                <img src="./assets/icons/presente.png" alt="Presente surpresa">
            </div>
        </header>

        <section class="input-group">
            <h2 class="subtitle" id="instruction-text">Digite o nome dos seus amigos</h2>
            
            <div class="input-wrapper">
                <input type="text" id="friend" placeholder="Digite um nome" autocomplete="off">
                <button class="btn-primary" onclick="addFriend()" id="btn-add">Adicionar</button>
            </div>
            
            <div class="lists-container">
                <ul id="friendsList" class="friends-list"></ul>
                <ul id="result" class="result-list"></ul>
            </div>
        </section>

        <footer class="actions">
            <button class="btn-action" onclick="drawFriend()" id="btn-draw">
                <img src="./assets/icons/sorteio.png" alt="Ícone sortear">
                <span id="txt-draw">Sortear Amigo</span>
            </button>
            
            <button class="btn-secondary" onclick="resetGame()" id="btn-reset" disabled>
                <span id="txt-reset">Novo Jogo</span>
            </button>
        </footer>
    </main>

    <div id="language-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">Escolha o idioma</h3>
            <div class="language-options" id="lang-options"></div>
            <button class="btn-close" onclick="closeModal()">Fechar</button>
        </div>
    </div>

    <div id="custom-alert" class="modal hidden">
        <div class="modal-content alert-content">
            <img id="alert-img" src="" alt="Alerta" class="alert-icon">
            <h3 id="alert-title" class="alert-title">Atenção</h3>
            <p id="alert-msg" class="alert-message"></p>
            <button class="btn-primary btn-alert" onclick="closeAlert()">OK</button>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
